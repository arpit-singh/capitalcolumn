services:
  postgres:
    image: postgres:16
    container_name: capitalcolumn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: capitalcolumn
      POSTGRES_USER: capitalcolumn_user
      POSTGRES_PASSWORD: CapColUser*1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitalcolumn_user -d capitalcolumn"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: capitalcolumn_api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - pipeline_data:/app/pipeline_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: capitalcolumn_admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "0.0.0.0:8080:80"

  pgadmin:
    image: dpage/pgadmin4
    container_name: capitalcolumn_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@capitalcolumn.com
      PGADMIN_DEFAULT_PASSWORD: CapColUser*1234
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pipeline_data:

networks:
  app_network:
    driver: bridge
