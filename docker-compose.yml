services:
  postgres:
    image: postgres:16
    container_name: capitalcolumn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: capitalcolumn
      POSTGRES_USER: capitalcolumn_user
      POSTGRES_PASSWORD: CapColUser*1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: capitalcolumn_api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    depends_on:
      - postgres
    networks:
      - app_network
    ports:
      - "127.0.0.1:8000:8000"

  pgadmin:
    image: dpage/pgadmin4
    container_name: capitalcolumn_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@capitalcolumn.com
      PGADMIN_DEFAULT_PASSWORD: CapColUser*1234
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - app_network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
